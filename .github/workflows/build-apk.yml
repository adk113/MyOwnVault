name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK binary
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/MyOwnVault.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyOwnVault-apk
          path: build-output/MyOwnVault.apk

      - name: Create or Update GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "MyOwnVault v1.0.0 (Offline Android APK)"
          draft: false
          prerelease: false
          body: |
            ## 🛡️ MyOwnVault v1.0.0 — Standalone Android APK

            Offline-first Personal Wealth & Credential Vault.
            
            - **Package**: `com.adk113.myownvault`
            - **Privacy**: Zero external server connections (`connect-src 'none'`)
            - **Security**: AES-GCM-256 + 600,000 PBKDF2 iterations
            - **Features**: 9 asset & liability ledger modules including Insurance & Risk Portfolios
            
            ### 📥 Download Link:
            Direct link to install: **[MyOwnVault.apk](https://github.com/adk113/MyOwnVault/releases/download/v1.0.0/MyOwnVault.apk)**
          files: build-output/MyOwnVault.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
