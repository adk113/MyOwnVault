<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="neonGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="aura512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Heavy Titanium Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad512)" stroke="#1e293b" stroke-width="8"/>

  <!-- Radial Cyber Aura -->
  <circle cx="256" cy="256" r="190" fill="url(#aura512)" />

  <!-- Outer Vault Bevel Rim -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#metalRim)" stroke-width="18" />
  <circle cx="256" cy="256" r="182" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="8 8" />

  <!-- Inner Vault Chamber -->
  <circle cx="256" cy="256" r="145" fill="#0b1120" stroke="url(#neonGrad512)" stroke-width="6" filter="url(#glow)" />

  <!-- Vault Locking Radial Bolts -->
  <rect x="246" y="58" width="20" height="36" rx="6" fill="url(#neonGrad512)"/>
  <rect x="246" y="418" width="20" height="36" rx="6" fill="url(#neonGrad512)"/>
  <rect x="58" y="246" width="36" height="20" rx="6" fill="url(#neonGrad512)"/>
  <rect x="418" y="246" width="36" height="20" rx="6" fill="url(#neonGrad512)"/>

  <!-- Precision Corner Bolts -->
  <circle cx="88" cy="88" r="10" fill="#334155" stroke="#64748b" stroke-width="3"/>
  <circle cx="424" cy="88" r="10" fill="#334155" stroke="#64748b" stroke-width="3"/>
  <circle cx="88" cy="424" r="10" fill="#334155" stroke="#64748b" stroke-width="3"/>
  <circle cx="424" cy="424" r="10" fill="#334155" stroke="#64748b" stroke-width="3"/>

  <!-- Neon Holographic M-Vault Monogram -->
  <path d="M152 344 L152 168 L256 264 L360 168 L360 344 L312 344 L312 232 L256 288 L200 232 L200 344 Z"
        fill="url(#neonGrad512)"
        filter="url(#glow)" />

  <!-- Central Core Diamond Nexus -->
  <polygon points="256,192 280,216 256,240 232,216" fill="#ffffff" opacity="0.95" />
</svg>
