<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Glowing ambient center -->
  <circle cx="32" cy="32" r="22" fill="url(#aura)" />

  <!-- Concentric Vault Rings -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 3"/>
  <circle cx="32" cy="32" r="18" fill="#0b1120" stroke="url(#neonGrad)" stroke-width="1.5" />

  <!-- Vault Lock Notches -->
  <line x1="32" y1="9" x2="32" y2="13" stroke="url(#neonGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="51" x2="32" y2="55" stroke="url(#neonGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="9" y1="32" x2="13" y2="32" stroke="url(#neonGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="51" y1="32" x2="55" y2="32" stroke="url(#neonGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Futuristic Geometric M-Vault Monogram -->
  <path d="M19 43 L19 21 L32 33 L45 21 L45 43 L39 43 L39 29 L32 36 L25 29 L25 43 Z"
        fill="url(#neonGrad)"
        filter="drop-shadow(0 2px 6px rgba(0,242,254,0.4))" />

  <!-- Core Diamond Accent -->
  <polygon points="32,24 35,27 32,30 29,27" fill="#ffffff" />
</svg>